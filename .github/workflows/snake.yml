name: Generate contribution snake

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Download light and dark contribution streak cards
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=default&hide_border=true&ring=0077B6&fire=00B4D8&currStreakLabel=0077B6" \
            --output dist/github-streak.svg
          curl --fail --location --retry 3 --retry-all-errors \
            "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=github-dark-blue&hide_border=true&ring=00B4D8&fire=0077B6&currStreakLabel=00B4D8" \
            --output dist/github-streak-dark.svg
          grep --quiet "<svg" dist/github-streak.svg
          grep --quiet "<svg" dist/github-streak-dark.svg

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: gh-pages
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
