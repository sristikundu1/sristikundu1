<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet"><title id="t">Developer roadmap</title><desc id="d">A path connecting five learning milestones.</desc><defs><style>.path{stroke-dasharray:14 12;animation:m 8s linear infinite}.node{animation:p 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.node:nth-of-type(2){animation-delay:.5s}.node:nth-of-type(3){animation-delay:1s}@keyframes m{to{stroke-dashoffset:-104}}@keyframes p{50%{transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(prefers-color-scheme:light){.card{fill:#fff}}</style></defs><path class="path" d="M90 180C210 45 310 260 440 135S680 250 910 90" fill="none" stroke="#0077b6" stroke-width="8"/><g fill="#03045e" stroke="#00b4d8" stroke-width="6"><circle class="node" cx="90" cy="180" r="34"/><circle class="node" cx="300" cy="185" r="34"/><circle class="node" cx="500" cy="105" r="34"/><circle class="node" cx="700" cy="180" r="34"/><circle class="node" cx="910" cy="90" r="34"/></g><g fill="#00b4d8"><path d="m75 180 10 10 22-25" fill="none" stroke="#00b4d8" stroke-width="7"/><path d="M286 169h28v32h-28zM486 91h28v28h-28zM686 166h28v28h-28zM896 76h28v28h-28z" opacity=".85"/></g></svg>
