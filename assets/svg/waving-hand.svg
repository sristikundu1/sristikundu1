<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-labelledby="title desc">
  <title id="title">Waving hand</title>
  <desc id="desc">A hand gently rotating from the wrist in a friendly greeting.</desc>
  <defs>
    <linearGradient id="skin" x1="18" y1="12" x2="52" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd66b"/>
      <stop offset=".55" stop-color="#ffbd3f"/>
      <stop offset="1" stop-color="#f4a62a"/>
    </linearGradient>
    <style>
      .hand {
        transform-box: view-box;
        transform-origin: 36px 64px;
        animation: wave 2.2s cubic-bezier(.45,0,.2,1) infinite;
      }
      @keyframes wave {
        0%, 10% { transform: rotate(0deg); }
        25% { transform: rotate(-11deg); }
        42% { transform: rotate(9deg); }
        58% { transform: rotate(-7deg); }
        72% { transform: rotate(5deg); }
        84%, 100% { transform: rotate(0deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hand { animation: none; }
      }
    </style>
  </defs>
  <g class="hand">
    <path d="M24.2 62.8c-4.6-4.7-6.5-10.7-5.5-18.3l-3.1-15.8c-.5-2.5.7-4.5 2.8-4.9 2.1-.4 3.7 1.1 4.2 3.4l2.1 10.5-2.1-18.1c-.3-2.6 1.2-4.5 3.3-4.7 2.2-.2 3.8 1.5 4 4l1.5 16.5-.2-21.2c0-2.7 1.6-4.4 3.8-4.4 2.1 0 3.6 1.7 3.6 4.3l.3 21.7 1.5-19c.2-2.5 1.8-4 3.9-3.8 2.1.2 3.5 1.9 3.2 4.5l-1.7 20.4 2.7-15.1c.4-2.3 2.1-3.6 4-3.2 2 .4 3.1 2.2 2.6 4.5l-3.2 18.6 6.4-7.2c2.1-2.4 5.1-2.6 7-.7 1.8 1.8 1.5 4.5-.4 6.7L50.8 53.2c-3.4 5.2-7.8 9.3-13.3 11.8-4.7 2.1-9.6 1-13.3-2.2Z" fill="url(#skin)" stroke="#b86a12" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M26.3 44.5c2.2-1.4 4.7-1.9 7.4-1.5M31.9 54.3c3.9 1 7.7.3 11.3-2.1M42.2 43.4c2.5.7 4.7 2 6.4 4" fill="none" stroke="#d9851f" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>
  </g>
</svg>
